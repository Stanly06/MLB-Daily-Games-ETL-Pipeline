<style>
/* Layout: day game at the ballpark — MLB-red scoreboard bar with a baseball-stitch seam, white field of tabs and stat sheets; one committed light look */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f4f1; --line: #dde1da;
  --ink: #1b1e1c; --muted: #5f6762; --accent: #c8102e; --accent-ink: #ffffff;
  --win: #1f7a3f; --loss: #c8102e; --gold: #c47a26; --chalk: #d6dbd3;
  --bar: #c8102e; --bar-ink: #ffffff; --seam: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
/* baseball seam: a white strip with red stitches under the scoreboard bar */
header.bar::after { content: ""; display: block; height: 9px; background:
  repeating-linear-gradient(120deg, transparent 0 7px, var(--accent) 7px 9px, transparent 9px 16px) top / 100% 4px no-repeat,
  repeating-linear-gradient(60deg, transparent 0 7px, var(--accent) 7px 9px, transparent 9px 16px) bottom / 100% 4px no-repeat,
  var(--seam); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .logo { --s: 40px; background: #ffffff; border: 0; border-radius: 6px; width: calc(var(--s) * 1.8); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.brand .logo b { color: var(--accent); font-size: 15px; }
.brand .logo img { inset: 5px 7px; width: calc(100% - 14px); height: calc(100% - 10px); object-fit: contain; }
.brand-text { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.brand span { font-family: var(--f-data); font-size: 11px; opacity: .92; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
select, input[type=search] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
header select { background: var(--bar-ink); color: var(--ink); border-color: transparent; }
button { font: inherit; cursor: pointer; }
.lang { border: 1px solid color-mix(in srgb, var(--bar-ink) 60%, transparent); background: transparent; color: var(--bar-ink); border-radius: var(--r); padding: 5px 9px; font-family: var(--f-data); font-size: 12px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
header :focus-visible { outline-color: var(--bar-ink); }

nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs a:hover { color: var(--ink); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { font-family: var(--f-display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-decoration: none; padding: 10px 12px 8px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main .wrap { padding-block: 20px 48px; display: grid; gap: 20px; }
h2 { font-family: var(--f-display); font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h3 { font-family: var(--f-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; color: var(--muted); }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; box-shadow: inset -1px -1px 0 var(--line); }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .s { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.pos { color: var(--win); } .neg { color: var(--loss); }

.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
td { font-family: var(--f-data); font-size: 12.5px; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td.name { font-family: var(--f-body); font-size: 13.5px; font-weight: 500; }
tbody tr:hover { background: var(--surface-2); }
tr.click { cursor: pointer; }
.pill { display: inline-block; font-family: var(--f-data); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.pill.w { color: var(--win); } .pill.l { color: var(--loss); } .pill.g { color: var(--gold); }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.profile { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.profile .nm { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1; text-transform: uppercase; }
.chart { position: relative; height: 280px; }
.results { display: flex; flex-wrap: wrap; gap: 6px; }
.results button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 4px 9px; font-size: 13px; }
.results button:hover { border-color: var(--accent); }
.results button span { color: var(--muted); font-family: var(--f-data); font-size: 11px; margin-left: 4px; }
.logo { position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
.logo b { font-family: var(--f-display); font-size: calc(var(--s) * .34); font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.logo img { position: absolute; inset: 14%; width: 72%; height: 72%; object-fit: contain; }
.shot { position: relative; display: grid; place-items: center; width: 132px; max-width: 100%; aspect-ratio: 213 / 320; flex: none; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.shot b { font-family: var(--f-display); font-size: 44px; font-weight: 700; color: var(--muted); }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero { display: flex; flex-wrap: wrap; gap: 16px 20px; align-items: center; }
.hero .meta { display: grid; gap: 8px; min-width: 0; flex: 1 1 260px; }
.hero .pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.team-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; }
.flag { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-weight: 400; }
h2 .flag { font-size: .9em; margin-right: 8px; vertical-align: 1px; }
.stars { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.star { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; min-width: 0; }
.star:hover { border-color: var(--accent); }
.star .shot { width: 58px; }
.star .shot b { font-size: 22px; }
.star .who { display: grid; gap: 2px; min-width: 0; }
.star .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.star .nm2 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.star .num { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1; color: var(--accent); }
.tall { max-height: 520px; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day { display: grid; gap: 0; }
.day h4 { margin: 14px 0 6px; font-family: var(--f-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.game { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 6px; }
.game .tm { font-family: var(--f-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.game .mu { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.game .mu .side { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.game .mu .won { color: var(--win); }
.game .sub { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.game .right { display: flex; align-items: center; gap: 8px; }
.score { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.fc { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.fc .teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.fc .team { display: flex; align-items: center; gap: 10px; min-width: 0; }
.fc .team.home { justify-content: flex-end; text-align: right; }
.fc .team b { font-family: var(--f-display); font-size: 22px; }
.fc .pct { font-family: var(--f-display); font-size: 30px; font-weight: 700; }
.fc .fav { color: var(--accent); }
.bar2 { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.bar2 span { display: block; height: 100%; }
.fc .meta2 { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }
.odds { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.odds input { width: 84px; font: inherit; font-family: var(--f-data); padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--r); }
.odds .out { font-family: var(--f-data); font-size: 12.5px; }
.disclaimer { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--gold); padding: 6px 10px; background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0; }
@media (max-width: 560px) { .game { grid-template-columns: 64px minmax(0, 1fr); } .game .right { grid-column: 2; } .fc .pct { font-size: 24px; } }
.pc { display: inline-flex; align-items: center; gap: 8px; }
.av { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.av b { font-family: var(--f-display); font-size: 13px; font-weight: 600; color: var(--muted); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
td .logo { margin-right: 6px; }
.note { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 18px 0; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 32px; }
@media (max-width: 560px) { .shot { width: 104px; } .profile .nm { font-size: 30px; } h2 { font-size: 24px; } .stat .v { font-size: 26px; } }
/* League executive view */
.lg-sec { display: grid; gap: 10px; }
.lg-h { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); margin: 6px 0 0; padding-left: 10px; border-left: 4px solid var(--accent); }
.lg-k { margin: 2px 0 -4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lg-i { font-size: 10px; opacity: .7; }
.lg-ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
.lg-split { display: grid; gap: 16px; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; }
.lg-split .chart { height: auto; }
.lg-t th.sel, .lg-t td.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--ink); font-weight: 600; }
.lg-t tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
.thb { all: unset; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.thb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
details.defs summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
details.defs dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 4px; font-size: 12.5px; }
details.defs dt { font-weight: 600; } details.defs dd { margin: 0; color: var(--muted); }
@media (max-width: 860px) { .lg-split { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  return `<div class="seg" id="${id}" role="group">${items.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${String(cur) === String(k)}">${l}</button>`).join("")}</div>`;
}
function lgStat(k, v, sub, tip, sub2) {
  return `<div class="stat" title="${esc(tip)}"><span class="k">${k} <span class="lg-i" aria-hidden="true">ⓘ</span></span><span class="v">${v}</span><span class="s">${sub || "&nbsp;"}</span>${sub2 ? `<span class="s">${sub2}</span>` : ""}</div>`;
}
// Variation vs the previous season: only when both values exist; counting stats only when both seasons have a
// comparable number of games (within 2 %), so a season in progress is never compared with a complete one.
function lgDelta(cur, prev, prevSeason, comparable = true) {
  if (!comparable || cur == null || prev == null || !prev) return "";
  const p = (cur - prev) / Math.abs(prev) * 100;
  const arrow = Math.abs(p) < 0.05 ? "=" : p > 0 ? "▲" : "▼";
  return `${arrow} ${Math.abs(p).toFixed(1)} % ${t("lgVs").replace("{s}", prevSeason)}`;
}
function lgDaily(season, type) {
  const d = tbl("daily").filter(r => r.season === season && r.season_type === type);
  const games = d.reduce((a, r) => a + (r.completed_games || 0), 0);
  const att = d.filter(r => r.avg_attendance).map(r => [r.avg_attendance, r.completed_games]);
  return { games, runs: d.reduce((a, r) => a + (r.total_runs || 0), 0), hr: d.reduce((a, r) => a + (r.home_runs || 0), 0),
    att: att.length ? att.reduce((a, [v, w]) => a + v * w, 0) / att.reduce((a, [, w]) => a + w, 0) : null,
    makeups: d.reduce((a, r) => a + (r.makeup_games || 0), 0) };
}
const MON_K = ["team_games", "r", "pa", "ab", "h", "hr", "bb", "hbp", "sf", "so", "tb"];
// Regular season: March (opening series) is grouped with April and early-October games with September.
const monKey = (m, type) => { const mm = m.slice(5); return type === "Regular Season" ? (mm === "03" ? "04" : mm === "10" ? "09" : mm) : mm; };
function monthly(season, type, lg) {
  const by = new Map();
  lgOf("league_monthly", season, type).filter(r => !lg || r.league === lg).forEach(r => {
    const k = monKey(r.month, type), a = by.get(k) || {};
    MON_K.forEach(x => { a[x] = (a[x] || 0) + (r[x] || 0); }); by.set(k, a);
  });
  return new Map([...by].sort().map(([k, s]) => [k, batRates(Object.assign({ g: s.team_games }, s))]));
}
const monLabel = k => {
  const nm = m => new Date(`2026-${m}-15T12:00:00Z`).toLocaleDateString(lang === "es" ? "es-DO" : "en-US", { month: "short", timeZone: "UTC" }).replace(".", "");
  return k === "04" ? `${nm("03")}–${nm("04")}` : k === "09" ? `${nm("09")}–${nm("10")}` : nm(k);
};
// Dashed reference line (league average) on a chart axis
const refLine = (value, axis) => ({ id: "lgRef", afterDatasetsDraw(c) {
  if (value == null || !c.scales[axis]) return;
  const p = c.scales[axis].getPixelForValue(value), a = c.chartArea, ctx = c.ctx;
  ctx.save(); ctx.strokeStyle = css("--ink"); ctx.globalAlpha = .55; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2; ctx.beginPath();
  if (axis === "x") { ctx.moveTo(p, a.top); ctx.lineTo(p, a.bottom); } else { ctx.moveTo(a.left, p); ctx.lineTo(a.right, p); }
  ctx.stroke(); ctx.restore(); } });

function viewH2H() {

  const opt = sel => tbl("teams").map(x => `<option value="${x.team_id}"${x.team_id === sel ? " selected" : ""}>${esc(x.team_name)}</option>`).join("");
  const h2h = tbl("head_to_head").filter(r => r.team_id === S.team && r.opponent_id === S.team2);
  const cur = h2h.filter(r => r.season === S.season && r.season_type === S.type);

function viewDR() {
  const ctry = tbl("countries").filter(r => r.season === S.season && r.season_type === S.type).sort((a, b) => b.players - a.players);
  if (ctry.length && !ctry.some(r => r.birth_country === S.country)) S.country = ctry[0].birth_country;
  const sel = ctry.find(r => r.birth_country === S.country) || {};
  const pid = new Set(tbl("players").filter(p => p.birth_country === S.country).map(p => p.player_id));
  const reg = S.type === "Regular Season";
  const bat = tbl("batting").filter(b => b.season === S.season && b.season_type === S.type && pid.has(b.player_id));
  const pit = tbl("pitching").filter(p => p.season === S.season && p.season_type === S.type && pid.has(p.player_id));
  const topC = ctry.slice(0, 12);
  if (!topC.some(r => r.birth_country === S.country) && sel.birth_country) topC.push(sel);
  const latest = tbl("latest_lines").filter(r => r.birth_country === S.country);
  const lastDay = tbl("latest_lines")[0];
  const minAvgPA = reg ? 200 : 10, minEraOuts = reg ? 90 : 9;

const START = new Map(has("game_times") ? tbl("game_times").map(r => [r.game_pk, r.start_utc]) : []);
const FEAT_ES = { d_win_pct: "Récord", d_run_diff: "Diferencial de carreras", d_last10: "Últimos 10", d_split: "Local/visitante",
  d_starter_fip: "Pitcher abridor", d_starter_kbb: "Ponches−boletos del abridor", d_bullpen_era: "Bullpen", d_bullpen_fatigue: "Descanso del bullpen",
  d_rest: "Días de descanso", park_factor: "Estadio", is_postseason: "Postemporada" };
const featLabel = (f, en) => lang === "es" ? (FEAT_ES[f] || f) : (en || f);
const tz = "America/Santo_Domingo";
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString(lang === "es" ? "es-DO" : "en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }) : "";
const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString(lang === "es" ? "es-DO" : "en-US", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
const pct0 = v => v == null ? "—" : Math.round(v * 100) + "%";
const amToProb = o => { o = Number(o); if (!o || Math.abs(o) < 100) return null; return o > 0 ? 100 / (o + 100) : -o / (-o + 100); };
const amPayout = o => (o = Number(o)) > 0 ? o : 10000 / -o;
const leagueOf = id => (TEAMS.get(id) || {}).league_abbreviation;

function factorText(pr, homeId, awayId) {
  let f = []; try { f = JSON.parse(pr.top_factors || "[]"); } catch (e) {}

  return f.filter(x => Math.abs(x.v) >= 0.02).map(x => `<span class="chip">${esc(featLabel(x.f, feats.get(x.f)))} → ${esc(abbr(x.v > 0 ? homeId : awayId))}</span>`).join("");
}

function calendarGames() {
  const done = tbl("games").map(g => ({ ...g, start_utc: START.get(g.game_pk), done: true }));
  const sch = has("schedule") ? tbl("schedule").map(g => ({ ...g, done: false })) : [];
  return done.concat(sch);
}
function viewCalendar() {
  const all = calendarGames();
  const calSeasons = [...new Set(all.map(g => g.season))].sort((a, b) => b - a);
  if (!S.calSeason) S.calSeason = Math.max(...(has("schedule") && tbl("schedule").length ? tbl("schedule").map(g => g.season) : calSeasons));
  let rows = all.filter(g => g.season === S.calSeason);
  if (S.calLeague) rows = rows.filter(g => leagueOf(g.home_team_id) === S.calLeague || leagueOf(g.away_team_id) === S.calLeague);
  if (S.calTeam) rows = rows.filter(g => g.home_team_id === S.calTeam || g.away_team_id === S.calTeam);
  rows.sort((a, b) => (a.start_utc || a.official_date).localeCompare(b.start_utc || b.official_date) || a.game_pk - b.game_pk);
  const months = [...new Set(rows.map(g => g.official_date.slice(0, 7)))];
  const todayIso = new Date().toISOString().slice(0, 10);
  if (!months.includes(S.calMonth)) S.calMonth = (months.find(m => m >= todayIso.slice(0, 7)) || months[months.length - 1] || null);
  const monthRows = rows.filter(g => g.official_date.slice(0, 7) === S.calMonth);
  const byDay = new Map(); monthRows.forEach(g => { if (!byDay.has(g.official_date)) byDay.set(g.official_date, []); byDay.get(g.official_date).push(g); });
  const monthName = m => new Date(m + "-15T12:00:00Z").toLocaleDateString(lang === "es" ? "es-DO" : "en-US", { month: "short", timeZone: "UTC" });
  const teamOpts = `<option value="0">${t("allTeams")}</option>` + tbl("teams").filter(x => !S.calLeague || x.league_abbreviation === S.calLeague).map(x => `<option value="${x.team_id}"${x.team_id === S.calTeam ? " selected" : ""}>${esc(x.team_name)}</option>`).join("");
  const gameRow = g => {
    const pr = PRED.get(g.game_pk);
    const homeWon = g.done && g.home_score > g.away_score;
    const side = (id, won) => `<span class="side${won ? " won" : ""}">${logo(id, 26)}${esc(abbr(id))}</span>`;
    const right = g.done ? `<span class="score">${g.away_score}–${g.home_score}</span>` : (pr ? `<span class="pill ${pr.p >= 0.5 ? "w" : "g"}">${esc(abbr(pr.p >= 0.5 ? g.home_team_id : g.away_team_id))} ${pct0(Math.max(pr.p, 1 - pr.p))}</span>` : "");
    const check = g.done && pr && pr.correct != null ? `<span class="pill ${pr.correct ? "w" : "l"}" title="${t("pick")}">${pr.correct ? "✓" : "✗"}</span>` : "";
    const sub = [g.venue_name ? esc(g.venue_name) : "", g.series_description && g.season_type === "Postseason" ? `<span class="chip">${esc(g.series_description)}</span>` : "",
      !g.done ? `${t("starter")}: ${esc(g.away_probable_pitcher || t("tbd"))} vs ${esc(g.home_probable_pitcher || t("tbd"))}` : (g.winning_pitcher_id ? `W: ${esc(pname(g.winning_pitcher_id))}` : ""),
      leagueOf(g.home_team_id) !== leagueOf(g.away_team_id) ? `<span class="chip">${t("interleague")}</span>` : ""].filter(Boolean).join("<span>·</span>");
    return `<div class="game"><span class="tm">${g.start_time_tbd ? t("tbd") : (fmtTime(g.start_utc) || "—")}</span><div class="mu">${side(g.away_team_id, g.done && !homeWon)}<span class="note">@</span>${side(g.home_team_id, homeWon)}</div><div class="right">${right}${check}</div><div class="sub">${sub}</div></div>`;
  };
  let oppPanel = "";
  if (S.calTeam) {
    const opp = new Map();
    rows.forEach(g => { const home = g.home_team_id === S.calTeam, o = home ? g.away_team_id : g.home_team_id;
      const x = opp.get(o) || { o, n: 0, h: 0, a: 0, first: g.official_date }; x.n++; home ? x.h++ : x.a++; opp.set(o, x); });
    const list = [...opp.values()].sort((a, b) => b.n - a.n);
    const hg = rows.filter(g => g.home_team_id === S.calTeam).length;
    oppPanel = `<div class="panel"><h3>${t("nextOpp")} · ${esc((TEAMS.get(S.calTeam) || {}).team_name || "")} · ${S.calSeason}</h3>
      <div class="kv" style="margin-bottom:8px"><span>${t("games2")}: <b>${rows.length}</b></span><span>${t("homeG")}: <b>${hg}</b></span><span>${t("awayG")}: <b>${rows.length - hg}</b></span><span>${t("interleague")}: <b>${rows.filter(g => leagueOf(g.home_team_id) !== leagueOf(g.away_team_id)).length}</b></span></div>
      <div class="tall">${table([{ h: t("opp"), l: 1, cls: () => "name", v: x => tcell(x.o) }, { h: t("games2"), v: x => x.n }, { h: t("homeG"), v: x => x.h }, { h: t("awayG"), v: x => x.a }, { h: t("firstMeet"), v: x => x.first }], list)}</div></div>`;
  }
  view(`
    <section class="hero"><div class="meta"><h2>${t("calendar")} · ${S.calSeason}</h2><p class="lede">${t("calLede")}</p></div>
      <div class="pick"><label for="f-calseason" class="note">${t("season2")}</label><select id="f-calseason">${calSeasons.map(y => `<option${y === S.calSeason ? " selected" : ""}>${y}</option>`).join("")}</select>
        <label for="f-calteam" class="note">${t("team")}</label><select id="f-calteam">${teamOpts}</select></div></section>
    <div class="row"><span class="note">${t("league2")}</span><div class="seg" id="seg-league">${[["", t("allLeagues")], ["AL", "AL"], ["NL", "NL"]].map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${S.calLeague === k}">${l}</button>`).join("")}</div></div>
    <div class="row"><span class="note">${t("month")}</span><div class="seg" id="seg-month">${months.map(m => `<button type="button" data-k="${m}" aria-pressed="${m === S.calMonth}">${esc(monthName(m))}</button>`).join("")}</div></div>
    ${oppPanel}
    <div class="panel">${byDay.size ? [...byDay.entries()].map(([d, gs]) => `<div class="day"><h4>${esc(fmtDay(d))} <span class="note">· ${gs.length} ${t("games2").toLowerCase()}</span></h4>${gs.map(gameRow).join("")}</div>`).join("") : `<p class="empty">${t("calNone")}</p>`}</div>`);
  document.getElementById("f-calseason").onchange = e => { S.calSeason = Number(e.target.value); S.calMonth = null; render(); };
  document.getElementById("f-calteam").onchange = e => { S.calTeam = Number(e.target.value); render(); };
  document.querySelectorAll("#seg-league button").forEach(b => b.onclick = () => { S.calLeague = b.dataset.k; if (S.calTeam && S.calLeague && leagueOf(S.calTeam) !== S.calLeague) S.calTeam = 0; render(); });
  document.querySelectorAll("#seg-month button").forEach(b => b.onclick = () => { S.calMonth = b.dataset.k; render(); });
}

// ---------- shell ----------
function view(html) { killCharts(); document.getElementById("view").innerHTML = html; wireImages(); }
function bindRows(fn) { document.querySelectorAll("#view tr.click").forEach(tr => tr.onclick = () => fn(tr.dataset.k)); }
function go(name) { tab = name; try { history.replaceState(null, "", "#" + (HASH[name] || name)); } catch (e) {} render(); window.scrollTo({ top: 0 }); }
function render() {
  document.documentElement.lang = lang;
  document.getElementById("f-lang").textContent = lang === "es" ? "EN" : "ES";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.getElementById("mlb-logo").innerHTML = leagueLogo();
  document.getElementById("asof").textContent = `${t("asof")} ${RAW.meta.last_game_date}`;
  document.getElementById("f-season").innerHTML = seasons.map(s => `<option${s === S.season ? " selected" : ""}>${s}</option>`).join("");
  const types = ["Regular Season", "Postseason"].filter(ty => tbl("team_seasons").some(r => r.season === S.season && r.season_type === ty));
  if (!types.includes(S.type)) S.type = types[0] || "Regular Season";
  document.getElementById("f-type").innerHTML = types.map(ty => `<option value="${ty}"${ty === S.type ? " selected" : ""}>${t(ty)}</option>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(k => `<a href="#${HASH[k] || k}" data-tab="${k}"${k === tab ? ' aria-current="page"' : ""}>${t(k)}</a>`).join("");
  document.querySelectorAll("#tabs a").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.tab); });
  document.getElementById("foot").textContent = t("foot");
  ({ league: viewLeague, team: viewTeam, player: viewPlayer, h2h: viewH2H, leaders: viewLeaders, dr: viewDR, forecast: viewForecast, calendar: viewCalendar, quality: viewQuality })[tab]();
}
document.getElementById("f-season").onchange = e => { S.season = Number(e.target.value); render(); };
document.getElementById("f-type").onchange = e => { S.type = e.target.value; render(); };
document.getElementById("f-lang").onclick = () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("mlb-lang", lang); } catch (e) {} render(); };
window.addEventListener("hashchange", () => { const h = fromHash(location.hash.slice(1)); if (TABS.includes(h) && h !== tab) { tab = h; render(); } });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
