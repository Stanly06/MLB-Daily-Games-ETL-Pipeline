<style>
/* Layout: day game at the ballpark — MLB-red scoreboard bar with a baseball-stitch seam, white field of tabs and stat sheets; one committed light look */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f4f1; --line: #dde1da;
  --ink: #1b1e1c; --muted: #5f6762; --accent: #c8102e; --accent-ink: #ffffff;
  --win: #1f7a3f; --loss: #c8102e; --gold: #c47a26; --chalk: #d6dbd3;
  --bar: #c8102e; --bar-ink: #ffffff; --seam: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
/* baseball seam: a white strip with red stitches under the scoreboard bar */
header.bar::after { content: ""; display: block; height: 9px; background:
  repeating-linear-gradient(120deg, transparent 0 7px, var(--accent) 7px 9px, transparent 9px 16px) top / 100% 4px no-repeat,
  repeating-linear-gradient(60deg, transparent 0 7px, var(--accent) 7px 9px, transparent 9px 16px) bottom / 100% 4px no-repeat,
  var(--seam); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .logo { --s: 38px; background: transparent; border: 0; border-radius: 4px; width: calc(var(--s) * 1.75); }
.brand .logo b { color: var(--bar-ink); font-size: 15px; }
.brand .logo img { inset: 0; width: 100%; height: 100%; }
.brand-text { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.brand span { font-family: var(--f-data); font-size: 11px; opacity: .7; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
select, input[type=search] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
header select { background: var(--bar-ink); color: var(--ink); border-color: transparent; }
button { font: inherit; cursor: pointer; }
.lang { border: 1px solid color-mix(in srgb, var(--bar-ink) 60%, transparent); background: transparent; color: var(--bar-ink); border-radius: var(--r); padding: 5px 9px; font-family: var(--f-data); font-size: 12px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
header :focus-visible { outline-color: var(--bar-ink); }

nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs a:hover { color: var(--ink); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { font-family: var(--f-display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-decoration: none; padding: 10px 12px 8px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main .wrap { padding-block: 20px 48px; display: grid; gap: 20px; }
h2 { font-family: var(--f-display); font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h3 { font-family: var(--f-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; color: var(--muted); }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .s { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.pos { color: var(--win); } .neg { color: var(--loss); }

.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
td { font-family: var(--f-data); font-size: 12.5px; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td.name { font-family: var(--f-body); font-size: 13.5px; font-weight: 500; }
tbody tr:hover { background: var(--surface-2); }
tr.click { cursor: pointer; }
.pill { display: inline-block; font-family: var(--f-data); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.pill.w { color: var(--win); } .pill.l { color: var(--loss); } .pill.g { color: var(--gold); }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.profile { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.profile .nm { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1; text-transform: uppercase; }
.chart { position: relative; height: 280px; }
.results { display: flex; flex-wrap: wrap; gap: 6px; }
.results button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 4px 9px; font-size: 13px; }
.results button:hover { border-color: var(--accent); }
.results button span { color: var(--muted); font-family: var(--f-data); font-size: 11px; margin-left: 4px; }
.logo { position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
.logo b { font-family: var(--f-display); font-size: calc(var(--s) * .34); font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.logo img { position: absolute; inset: 14%; width: 72%; height: 72%; object-fit: contain; }
.shot { position: relative; display: grid; place-items: center; width: 132px; max-width: 100%; aspect-ratio: 213 / 320; flex: none; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.shot b { font-family: var(--f-display); font-size: 44px; font-weight: 700; color: var(--muted); }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero { display: flex; flex-wrap: wrap; gap: 16px 20px; align-items: center; }
.hero .meta { display: grid; gap: 8px; min-width: 0; flex: 1 1 260px; }
.hero .pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.team-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; }
.flag { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-weight: 400; }
h2 .flag { font-size: .9em; margin-right: 8px; vertical-align: 1px; }
.stars { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.star { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; min-width: 0; }
.star:hover { border-color: var(--accent); }
.star .shot { width: 58px; }
.star .shot b { font-size: 22px; }
.star .who { display: grid; gap: 2px; min-width: 0; }
.star .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.star .nm2 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.star .num { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1; color: var(--accent); }
.tall { max-height: 520px; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pc { display: inline-flex; align-items: center; gap: 8px; }
.av { position: relative; display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.av b { font-family: var(--f-display); font-size: 11px; font-weight: 600; color: var(--muted); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
td .logo { margin-right: 6px; }
.note { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 18px 0; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 32px; }
@media (max-width: 560px) { .shot { width: 104px; } .profile .nm { font-size: 30px; } h2 { font-size: 24px; } .stat .v { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const fmtHeight = h => h ? `${Math.floor(h / 12)}' ${h % 12}"` : "—";

// ---------- state ----------
const seasons = RAW.meta.seasons.slice().sort((a, b) => b - a);
const S = { season: seasons[0], type: "Regular Season", team: null, team2: null, player: null, q: "", country: "Dominican Republic" };
const TABS = ["league", "team", "player", "h2h", "leaders", "dr", "quality"];
const hashTab = location.hash.slice(1) === "countries" ? "dr" : location.hash.slice(1);
let tab = TABS.includes(hashTab) ? hashTab : "league";
const charts = [];
const killCharts = () => { while (charts.length) charts.pop().destroy(); };

const teamSeasons = () => tbl("team_seasons").filter(r => r.season === S.season && r.season_type === S.type);
const defaultTeam = () => { const ts = teamSeasons().sort((a, b) => b.wins - a.wins); return ts.length ? ts[0].team_id : tbl("teams")[0].team_id; };

// ---------- rendering helpers ----------
const stat = (k, v, s, c = "") => `<div class="stat"><span class="k">${k}</span><span class="v ${c}">${v}</span>${s ? `<span class="s">${s}</span>` : ""}</div>`;
function table(cols, rows, opts = {}) {
  if (!rows.length) return `<p class="empty">${opts.empty || t("noLine")}</p>`;
  const head = cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("");
  const body = rows.map(r => `<tr${opts.click ? ` class="click" data-k="${esc(opts.click(r))}"` : ""}>${cols.map(c => `<td class="${c.cls ? c.cls(r) : ""}${c.l ? " l" : ""}">${c.v(r)}</td>`).join("")}</tr>`).join("");
  return `<div class="tscroll"><table${opts.id ? ` id="${opts.id}"` : ""}><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function chart(id, cfg) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const ink = css("--muted"), grid = css("--chalk");
  Chart.defaults.font.family = css("--f-data").replace(/"/g, "");
  Chart.defaults.color = ink;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { labels: { boxWidth: 10, color: ink } } } }, cfg.options || {});
  for (const ax of Object.values(cfg.options.scales || {})) { ax.grid = Object.assign({ color: grid }, ax.grid || {}); ax.ticks = Object.assign({ color: ink }, ax.ticks || {}); }
  charts.push(new Chart(el, cfg));
}

// ---------- views ----------
function viewLeague() {
  const ts = teamSeasons();
  const daily = tbl("daily").filter(r => r.season === S.season && r.season_type === S.type);
  const games = daily.reduce((a, r) => a + (r.completed_games || 0), 0);
  const runs = daily.reduce((a, r) => a + (r.total_runs || 0), 0);
  const hr = daily.reduce((a, r) => a + (r.home_runs || 0), 0);
  const att = daily.filter(r => r.avg_attendance).map(r => [r.avg_attendance, r.completed_games]);
  const avgAtt = att.length ? att.reduce((a, [v, w]) => a + v * w, 0) / att.reduce((a, [, w]) => a + w, 0) : null;
  const makeups = daily.reduce((a, r) => a + (r.makeup_games || 0), 0);
  const divisions = [...new Set(ts.map(r => r.division_name))].sort();
  const cols = [
    { h: t("team"), l: 1, cls: () => "name", v: r => tcell(r.team_id) },
    { h: "W", v: r => r.wins }, { h: "L", v: r => r.losses }, { h: "PCT", v: r => f3(r.win_pct) },
    ...(S.type === "Regular Season" ? [{ h: "GB", v: r => esc(r.games_back ?? "—") }] : []),
    { h: t("rd"), v: r => sgn(r.run_differential), cls: r => cls(r.run_differential) },
    { h: "xW", v: r => f1(r.expected_wins) }, { h: "±", v: r => sgn(r.luck_wins), cls: r => cls(r.luck_wins) },
    { h: "L10", v: r => `${r.last_10_wins}-${r.last_10_losses}` },
    { h: t("streak"), v: r => `<span class="pill ${String(r.current_streak).startsWith("W") ? "w" : "l"}">${esc(r.current_streak)}</span>` },
  ];
  const standings = S.type === "Regular Season"
    ? divisions.map(d => `<div class="panel"><h3>${esc(d)}</h3>${table(cols, ts.filter(r => r.division_name === d).sort((a, b) => b.win_pct - a.win_pct), { click: r => r.team_id })}</div>`).join("")
    : `<div class="panel"><h3>${t("standings")}</h3>${table(cols, ts.slice().sort((a, b) => b.wins - a.wins || b.win_pct - a.win_pct), { click: r => r.team_id })}</div>`;
  view(`
    <section><h2>${t("league")} · ${S.season}</h2><p class="lede">${t("leagueLede")}</p></section>
    <div class="stats">${stat(t("games"), n0(games))}${stat(t("avgRuns"), games ? f2(runs / games) : "—")}${stat(t("hr"), n0(hr), games ? f2(hr / games) + " / G" : "")}${stat(t("att"), n0(avgAtt))}${stat(t("makeups"), n0(makeups))}</div>
    <div class="grid wide">
      <div class="panel"><h3>${t("rdVsW")}</h3><div class="chart"><canvas id="c-scatter" aria-label="${t("rdVsW")}"></canvas></div></div>
      <div class="panel"><h3>${t("luck")}</h3><p class="note">${t("luckLede")}</p><div class="chart"><canvas id="c-luck"></canvas></div></div>
    </div>
    <div class="grid">${standings}</div>`);
  const acc = css("--accent"), win = css("--win"), loss = css("--loss");
  chart("c-scatter", { type: "scatter", data: { datasets: [{ label: t("team"), data: ts.map(r => ({ x: r.run_differential, y: r.wins, a: r.team_abbreviation })), backgroundColor: acc, pointRadius: 5 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw.a}: ${sgn(c.raw.x)} RD, ${c.raw.y} W` } } },
      scales: { x: { title: { display: true, text: t("rd") } }, y: { title: { display: true, text: "W" } } } } });
  const lk = ts.slice().sort((a, b) => b.luck_wins - a.luck_wins);
  chart("c-luck", { type: "bar", data: { labels: lk.map(r => r.team_abbreviation), datasets: [{ data: lk.map(r => r.luck_wins), backgroundColor: lk.map(r => r.luck_wins >= 0 ? win : loss) }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { autoSkip: false, maxRotation: 90, font: { size: 10 } } }, y: {} } } });
  bindRows(k => { S.team = Number(k); go("team"); });
}

function viewTeam() {
  S.team = S.team || defaultTeam();
  const opts = tbl("teams").map(x => `<option value="${x.team_id}"${x.team_id === S.team ? " selected" : ""}>${esc(x.team_name)}</option>`).join("");
  const r = teamSeasons().find(x => x.team_id === S.team);
  const log = ser("team_logs", `${S.season}|${S.type}|${S.team}`);
  const bat = tbl("batting").filter(b => b.season === S.season && b.season_type === S.type && b.team_id === S.team && b.pa >= (S.type === "Regular Season" ? 150 : 10)).sort((a, b) => b.ops - a.ops).slice(0, 8);
  const pit = tbl("pitching").filter(p => p.season === S.season && p.season_type === S.type && p.team_id === S.team && p.outs >= (S.type === "Regular Season" ? 120 : 9)).sort((a, b) => a.era - b.era).slice(0, 8);
  view(`
    <section class="hero">${logo(S.team, 76)}
      <div class="meta"><h2>${esc((TEAMS.get(S.team) || {}).team_name)} · ${S.season}</h2>
        <span class="note">${esc((TEAMS.get(S.team) || {}).league_abbreviation || "")} · ${esc((TEAMS.get(S.team) || {}).division_name || "")} · ${t(S.type)}</span></div>
      <div class="pick"><label for="f-team" class="note">${t("team")}</label><select id="f-team">${opts}</select></div></section>
    <p class="lede">${t("teamLede")}</p>
    ${r ? `<div class="stats">${stat(t("record"), `${r.wins}-${r.losses}`, f3(r.win_pct))}${stat(t("rd"), sgn(r.run_differential), `${f2(r.runs_scored_per_game)} RS/G · ${f2(r.runs_allowed_per_game)} RA/G`, cls(r.run_differential))}${stat(t("expW"), f1(r.expected_wins), `${sgn(r.luck_wins)} vs real`, cls(r.luck_wins))}${stat(t("streak"), esc(r.current_streak), `${t("last10")}: ${r.last_10_wins}-${r.last_10_losses}`)}${stat(t("home"), `${r.home_wins}-${r.home_losses}`, `${t("away")}: ${r.away_wins}-${r.away_losses}`)}${stat(t("oneRun"), `${r.one_run_wins}-${r.one_run_losses}`, `${t("extra")}: ${r.extra_inning_wins}-${r.extra_inning_losses}`)}</div>` : `<p class="empty">${t("noLine")}</p>`}
    ${log.length ? `<div class="panel"><h3>${t("trajectory")}</h3><div class="chart"><canvas id="c-traj"></canvas></div></div>` : ""}
    <div class="grid wide">
      <div class="panel"><h3>${t("topHitters")}</h3>${table([{ h: t("player"), l: 1, cls: () => "name", v: b => pcell(b.player_id) }, { h: "PA", v: b => b.pa }, { h: "AVG", v: b => f3(b.avg) }, { h: "OBP", v: b => f3(b.obp) }, { h: "SLG", v: b => f3(b.slg) }, { h: "OPS", v: b => f3(b.ops) }, { h: "HR", v: b => b.hr }, { h: "RBI", v: b => b.rbi }], bat, { click: b => b.player_id })}</div>
      <div class="panel"><h3>${t("topPitchers")}</h3>${table([{ h: t("player"), l: 1, cls: () => "name", v: p => pcell(p.player_id) }, { h: "IP", v: p => p.ip_display }, { h: "ERA", v: p => f2(p.era) }, { h: "WHIP", v: p => f2(p.whip) }, { h: "SO", v: p => p.so }, { h: "FIP", v: p => f2(p.fip) }, { h: "W-L", v: p => `${p.w}-${p.l}` }, { h: "SV", v: p => p.sv }], pit, { click: p => p.player_id })}</div>
    </div>
    <div class="panel"><h3>${t("lastGames")}</h3>${table([{ h: t("date"), l: 1, v: g => g.official_date }, { h: t("opp"), l: 1, v: g => (g.is_home ? "vs " : "@ ") + abbr(g.opponent_id) }, { h: t("res"), v: g => `<span class="pill ${g.result === "W" ? "w" : "l"}">${g.result} ${g.runs_scored}-${g.runs_allowed}</span>` }, { h: t("record"), v: g => `${g.wins_to_date}-${g.losses_to_date}` }, { h: t("rdCum"), v: g => sgn(g.run_differential_to_date), cls: g => cls(g.run_differential_to_date) }], log.slice(-10).reverse())}</div>`);
  document.getElementById("f-team").onchange = e => { S.team = Number(e.target.value); render(); };
  if (log.length) chart("c-traj", { type: "line", data: { labels: log.map(g => g.team_game_number), datasets: [
      { label: t("overFive"), data: log.map(g => g.wins_to_date - g.losses_to_date), borderColor: css("--accent"), backgroundColor: css("--accent"), pointRadius: 0, borderWidth: 2, yAxisID: "y" },
      { label: t("rdCum"), data: log.map(g => g.run_differential_to_date), borderColor: css("--gold"), backgroundColor: css("--gold"), pointRadius: 0, borderWidth: 1.5, borderDash: [4, 3], yAxisID: "y2" }] },
    options: { interaction: { mode: "index", intersect: false }, scales: { x: { title: { display: true, text: t("games") }, ticks: { maxTicksLimit: 12 } }, y: { title: { display: true, text: t("overFive") } }, y2: { position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: t("rdCum") } } } } });

function viewPlayer() {
  if (!S.player) { const top = tbl("batting").filter(b => b.season === S.season && b.season_type === "Regular Season" && b.is_qualified).sort((a, b) => b.ops - a.ops)[0]; S.player = top ? top.player_id : tbl("players")[0].player_id; }
  const p = PLAYERS.get(S.player) || {};
  const bat = tbl("batting").filter(b => b.player_id === S.player);
  const pit = tbl("pitching").filter(x => x.player_id === S.player);
  const b = bat.find(x => x.season === S.season && x.season_type === S.type);
  const q = pit.find(x => x.season === S.season && x.season_type === S.type);
  const blog = ser("batting_logs", `${S.season}|Regular Season|${S.player}`);
  const plog = ser("pitching_logs", `${S.season}|Regular Season|${S.player}`);
  const isPitcher = (p.primary_position === "P" || p.primary_position === "TWP") && pit.length;
  const any = b || q;
  const team = any ? abbr(any.team_id) : "";
  view(`
    <section><h3>${t("player")}</h3>
      <div class="row"><input type="search" id="f-q" placeholder="${t("search")}" value="${esc(S.q)}" autocomplete="off" aria-label="${t("search")}"></div>
      <div class="results" id="q-res" style="margin-top:8px"></div></section>
    <section class="panel hero">${shot(S.player, p.player_name)}
      <div class="meta">
        <div class="profile"><span class="nm">${esc(p.player_name)}</span><span class="chip">${esc(p.primary_position || "")}</span></div>
        ${p.current_team_id ? `<div class="team-line">${logo(p.current_team_id, 40)}<span><span class="note">${t("currentTeam")}</span><br><b>${esc((TEAMS.get(p.current_team_id) || {}).team_name || "")}</b></span></div>` : ""}
        <div class="kv"><span>${t("position")}: <b>${esc(p.primary_position_name || p.primary_position || "—")}</b></span>
          <span>${t("bats")}/${t("throws")}: <b>${esc(p.bats || "—")}/${esc(p.throws || "—")}</b></span>

          <span>${t("born")}: <b>${p.birth_country ? flag(p.birth_country) + " " : ""}${esc([p.birth_city, cname(p.birth_country)].filter(Boolean).join(", ") || "—")}</b></span>
          <span>${t("debut")}: <b>${esc(p.mlb_debut_date || "—")}</b></span></div>
        ${any ? `<div class="kv"><span class="pc">${t("seasonTeam")} ${S.season} (${t(S.type)}): ${logo(any.team_id, 22)}<b>${esc(team)}</b></span>${any.teams_played > 1 ? `<span>${t("playedFor").replace("{n}", any.teams_played)}</span>` : ""}</div>` : ""}
      </div></section>
    ${b && !isPitcher ? batBlock(b) : ""}${q ? pitBlock(q) : ""}${b && isPitcher ? batBlock(b) : ""}
    ${!b && !q ? `<p class="empty">${t("noLine")}</p>` : ""}
    ${b || q ? `<div class="panel"><h3>${t("fullStats")} · ${S.season} · ${t(S.type)}</h3>${b ? fullBat(b) : ""}${q ? fullPit(q) : ""}</div>` : ""}
    ${blog.length && !isPitcher ? `<div class="panel"><h3>${t("form")} · ${S.season}</h3><div class="chart"><canvas id="c-form"></canvas></div></div>` : ""}
    ${plog.length && isPitcher ? `<div class="panel"><h3>${t("form5")} · ${S.season}</h3><div class="chart"><canvas id="c-form"></canvas></div></div>` : ""}
    <div class="grid wide">
      ${blog.length && !isPitcher ? `<div class="panel"><h3>${t("gameLog")}</h3>${table([{ h: t("date"), l: 1, v: g => g.game_day }, { h: t("opp"), l: 1, v: g => abbr(g.opponent_id) }, { h: "AB", v: g => g.ab }, { h: "H", v: g => g.h }, { h: "HR", v: g => g.hr }, { h: "RBI", v: g => g.rbi }, { h: "OPS 15", v: g => f3(g.ops_last_15) }, { h: "OPS", v: g => f3(g.ops_season_to_date) }], blog.slice(-12).reverse())}</div>` : ""}

  const input = document.getElementById("f-q");
  const showRes = () => {
    S.q = input.value; const qq = S.q.trim().toLowerCase(); const box = document.getElementById("q-res");
    if (qq.length < 2) { box.innerHTML = `<span class="note">${t("searchHint")}</span>`; return; }
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    box.innerHTML = hits.map(x => `<button type="button" data-p="${x.player_id}">${esc(x.player_name)}${x.current_team_id ? `<span>${esc(abbr(x.current_team_id))}</span>` : ""}</button>`).join("") || `<span class="note">0</span>`;
    box.querySelectorAll("button").forEach(btn => btn.onclick = () => { S.player = Number(btn.dataset.p); S.q = ""; render(); });

  input.oninput = showRes; showRes();
  const acc = css("--accent"), gold = css("--gold");
  if (blog.length && !isPitcher) chart("c-form", { type: "line", data: { labels: blog.map(g => g.game_day), datasets: [

    options: { interaction: { mode: "index", intersect: false }, scales: { x: { ticks: { maxTicksLimit: 10 } }, y: { suggestedMin: 0.4 } } } });
  if (plog.length && isPitcher) chart("c-form", { type: "line", data: { labels: plog.map(g => g.game_day), datasets: [
      { label: "ERA (5)", data: plog.map(g => g.era_last_5), borderColor: acc, backgroundColor: acc, pointRadius: 2, borderWidth: 2 },
      { label: "ERA " + t("season").toLowerCase(), data: plog.map(g => g.era_season_to_date), borderColor: gold, backgroundColor: gold, pointRadius: 0, borderWidth: 1.5, borderDash: [4, 3] }] },
    options: { interaction: { mode: "index", intersect: false }, scales: { x: { ticks: { maxTicksLimit: 10 } }, y: { suggestedMin: 0 } } } });
}
const batBlock = b => `<div class="stats">${stat("AVG", f3(b.avg), b.avg_rank_qualified ? `#${b.avg_rank_qualified} MLB` : `${b.h} H · ${b.pa} PA`)}${stat("OBP", f3(b.obp))}${stat("SLG", f3(b.slg))}${stat("OPS", f3(b.ops), b.ops_rank_qualified ? `#${b.ops_rank_qualified} MLB (${t("qualified")})` : "")}${stat("HR", b.hr, `#${b.hr_rank} MLB`)}${stat("RBI", b.rbi, b.rbi_rank ? `#${b.rbi_rank} MLB` : "")}${stat("SB", b.sb, b.sb_rank && b.sb ? `#${b.sb_rank} MLB` : "")}${stat("K% / BB%", `${f1(b.k_pct)}`, `BB ${f1(b.bb_pct)}%`)}</div>`;
const fullBat = b => `<h3 style="margin-top:4px">${t("batting")}</h3>` + table(
  ["games:G", "games_started:GS", "pa:PA", "ab:AB", "r:R", "h:H", "doubles:2B", "triples:3B", "hr:HR", "rbi:RBI", "bb:BB", "ibb:IBB", "so:SO", "hbp:HBP", "sb:SB", "cs:CS", "sf:SF", "tb:TB", "gidp:GIDP"]
    .map(x => { const [k, h] = x.split(":"); return { h, v: r => r[k] ?? "—" }; })
    .concat([["avg", "AVG", f3], ["obp", "OBP", f3], ["slg", "SLG", f3], ["ops", "OPS", f3], ["iso", "ISO", f3], ["babip", "BABIP", f3], ["k_pct", "K%", f1], ["bb_pct", "BB%", f1]].map(([k, h, f]) => ({ h, v: r => f(r[k]) }))),
  [b]);
const fullPit = q => `<h3 style="margin-top:14px">${t("pitching")}</h3>` + table(
  ["games:G", "games_started:GS", "w:W", "l:L", "sv:SV", "svo:SVO", "hld:HLD", "bs:BS", "cg:CG", "sho:SHO", "quality_starts:QS", "ip_display:IP", "batters_faced:BF", "pitches:NP", "h:H", "r:R", "er:ER", "bb:BB", "so:SO", "hr:HR", "hbp:HBP"]
    .map(x => { const [k, h] = x.split(":"); return { h, v: r => r[k] ?? "—" }; })
    .concat([["era", "ERA", f2], ["whip", "WHIP", f2], ["k_per_9", "K/9", f2], ["bb_per_9", "BB/9", f2], ["hr_per_9", "HR/9", f2], ["k_bb_ratio", "K/BB", f2], ["k_pct", "K%", f1], ["bb_pct", "BB%", f1], ["fip", "FIP", f2]].map(([k, h, f]) => ({ h, v: r => f(r[k]) }))),
  [q]);
const pitBlock = q => `<div class="stats">${stat("ERA", f2(q.era), q.era_rank_qualified ? `#${q.era_rank_qualified} MLB` : `${q.ip_display} IP`)}${stat("WHIP", f2(q.whip))}${stat("FIP", f2(q.fip))}${stat("SO", q.so, `#${q.so_rank} MLB`)}${stat("K/9", f2(q.k_per_9), `BB/9 ${f2(q.bb_per_9)}`)}${stat("W-L", `${q.w}-${q.l}`, `SV ${q.sv}${q.sv ? ` (#${q.sv_rank})` : ""} · HLD ${q.hld}`)}${stat("IP", q.ip_display, `${q.games} G · ${q.games_started} GS`)}${stat("QS", q.quality_starts, esc(q.role))}</div>`;

function viewH2H() {
  S.team = S.team || defaultTeam();
  if (!S.team2 || S.team2 === S.team) { const h = tbl("head_to_head").filter(r => r.team_id === S.team && r.season === S.season && r.season_type === S.type).sort((a, b) => b.games - a.games)[0]; S.team2 = h ? h.opponent_id : tbl("teams").find(x => x.team_id !== S.team).team_id; }
  const opt = sel => tbl("teams").map(x => `<option value="${x.team_id}"${x.team_id === sel ? " selected" : ""}>${esc(x.team_name)}</option>`).join("");
  const h2h = tbl("head_to_head").filter(r => r.team_id === S.team && r.opponent_id === S.team2);
  const cur = h2h.filter(r => r.season === S.season && r.season_type === S.type);
  const sum = rows => rows.reduce((a, r) => ({ g: a.g + r.games, w: a.w + r.wins, l: a.l + r.losses, rs: a.rs + r.runs_scored, ra: a.ra + r.runs_allowed }), { g: 0, w: 0, l: 0, rs: 0, ra: 0 });
  const c = sum(cur), all = sum(h2h);
  const games = tbl("games").filter(g => (g.home_team_id === S.team && g.away_team_id === S.team2) || (g.home_team_id === S.team2 && g.away_team_id === S.team)).reverse();
  view(`
    <section><h2>${t("h2h")}</h2><p class="lede">${t("h2hLede")}</p></section>
    <div class="row"><select id="f-t1" aria-label="${t("team")} 1">${opt(S.team)}</select><span class="note">${t("vs")}</span><select id="f-t2" aria-label="${t("team")} 2">${opt(S.team2)}</select></div>
    <div class="stats">${stat(`${t("thisSeason")} (${S.season})`, c.g ? `${c.w}-${c.l}` : "—", c.g ? `${abbr(S.team)} · ${c.rs}-${c.ra} R` : t("noMeet"))}${stat(t("allSeasons"), all.g ? `${all.w}-${all.l}` : "—", all.g ? `${all.g} G · ${sgn(all.rs - all.ra)} RD` : "")}${stat(t("meetings"), games.length)}</div>
    <div class="panel"><h3>${t("meetings")}</h3>${table([
      { h: t("date"), l: 1, v: g => g.official_date }, { h: "", l: 1, v: g => `<span class="chip">${g.season_type === "Postseason" ? esc(g.series_description || "PS") : g.season}</span>` },
      { h: t("score"), l: 1, v: g => { const w = g.home_score > g.away_score ? g.home_team_id : g.away_team_id; return `<span class="pill ${w === S.team ? "w" : "l"}">${abbr(g.away_team_id)} ${g.away_score} @ ${abbr(g.home_team_id)} ${g.home_score}${g.innings_played > 9 ? ` (${g.innings_played})` : ""}</span>`; } },
      { h: t("wp"), l: 1, v: g => g.winning_pitcher_id ? pcell(g.winning_pitcher_id) : "—" }, { h: t("venue"), l: 1, v: g => esc(g.venue_name) }], games, { empty: t("noMeet") })}</div>`);
  document.getElementById("f-t1").onchange = e => { S.team = Number(e.target.value); render(); };
  document.getElementById("f-t2").onchange = e => { S.team2 = Number(e.target.value); render(); };
}

function viewLeaders() {
  const reg = S.type === "Regular Season";
  const bat = tbl("batting").filter(b => b.season === S.season && b.season_type === S.type);
  const pit = tbl("pitching").filter(p => p.season === S.season && p.season_type === S.type);
  const qb = reg ? bat.filter(b => b.is_qualified) : bat.filter(b => b.pa >= 15);
  const qp = reg ? pit.filter(p => p.is_qualified) : pit.filter(p => p.outs >= 15);
  const top = (rows, key, desc = true, n = 10) => rows.filter(r => r[key] != null).sort((a, b) => desc ? b[key] - a[key] : a[key] - b[key]).slice(0, n);
  const board = (title, rows, key, fmt, note) => `<div class="panel"><h3>${title}${note ? ` <span class="note">· ${note}</span>` : ""}</h3>${table([{ h: "#", v: (r) => rows.indexOf(r) + 1 }, { h: t("player"), l: 1, cls: () => "name", v: r => pcell(r.player_id) }, { h: "TM", l: 1, v: r => tcell(r.team_id) }, { h: title.split(" ")[0], v: r => fmt(r[key]) }], rows, { click: r => r.player_id })}</div>`;
  const qnote = reg ? t("qualified") : `${t("minPA")} 15 PA / 5 IP`;
  view(`
    <section><h2>${t("leaders")} · ${S.season}</h2><p class="lede">${t("leadersLede")}</p></section>
    <div class="grid">
      ${board("OPS", top(qb, "ops"), "ops", f3, qnote)}${board("AVG", top(qb, "avg"), "avg", f3, qnote)}
      ${board("HR", top(bat, "hr"), "hr", v => v)}${board("RBI", top(bat, "rbi"), "rbi", v => v)}${board("SB", top(bat, "sb"), "sb", v => v)}
      ${board("ERA", top(qp, "era", false), "era", f2, qnote)}${board("SO", top(pit, "so"), "so", v => v)}${board("SV", top(pit, "sv"), "sv", v => v)}${board("WHIP", top(qp, "whip", false), "whip", f2, qnote)}
    </div>`);
  bindRows(k => { S.player = Number(k); go("player"); });
}

function viewDR() {
  const ctry = tbl("countries").filter(r => r.season === S.season && r.season_type === S.type).sort((a, b) => b.players - a.players);
  if (ctry.length && !ctry.some(r => r.birth_country === S.country)) S.country = ctry[0].birth_country;
  const sel = ctry.find(r => r.birth_country === S.country) || {};
  const pid = new Set(tbl("players").filter(p => p.birth_country === S.country).map(p => p.player_id));
  const reg = S.type === "Regular Season";
  const bat = tbl("batting").filter(b => b.season === S.season && b.season_type === S.type && pid.has(b.player_id));
  const pit = tbl("pitching").filter(p => p.season === S.season && p.season_type === S.type && pid.has(p.player_id));
  const topC = ctry.slice(0, 12);
  if (!topC.some(r => r.birth_country === S.country) && sel.birth_country) topC.push(sel);
  const latest = tbl("latest_lines").filter(r => r.birth_country === S.country);
  const lastDay = tbl("latest_lines")[0];
  const minAvgPA = reg ? 200 : 10, minEraOuts = reg ? 90 : 9;
  const best = (rows, key, desc, fmt, cat, filt = () => true) => { const r = rows.filter(x => x[key] != null && filt(x)).sort((a, b) => desc ? b[key] - a[key] : a[key] - b[key])[0]; return r && (desc ? r[key] > 0 : true) ? { r, val: fmt(r[key]), cat } : null; };
  const stars = [
    best(bat, "hr", true, v => v, t("hrLeader")), best(bat, "avg", true, f3, t("avgLeader"), x => x.pa >= minAvgPA),
    best(bat, "ops", true, f3, t("opsLeader"), x => x.pa >= minAvgPA), best(bat, "rbi", true, v => v, t("rbiLeader")),
    best(bat, "sb", true, v => v, t("sbLeader")), best(pit, "so", true, v => v, t("soLeader")),
    best(pit, "era", false, f2, t("eraLeader"), x => x.outs >= minEraOuts), best(pit, "sv", true, v => v, t("svLeader")),
    best(pit, "w", true, v => v, t("wLeader")),
  ].filter(Boolean);
  const hrRows = bat.filter(b => b.hr > 0).sort((a, b) => b.hr - a.hr || b.ops - a.ops);
  const soRows = pit.filter(p => p.so > 0).sort((a, b) => b.so - a.so);
  const trendRows = seasons.slice().sort().map(y => tbl("countries").find(r => r.season === y && r.season_type === S.type && r.birth_country === S.country) || { season: y });
  const teamCount = {}; const seenP = new Set();
  [...bat, ...pit].forEach(r => { if (!seenP.has(r.player_id)) { seenP.add(r.player_id); teamCount[r.team_id] = (teamCount[r.team_id] || 0) + 1; } });
  const teamsTop = Object.entries(teamCount).map(([id, n]) => [Number(id), n]).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const posCount = {}; seenP.forEach(id => { const pos = (PLAYERS.get(id) || {}).primary_position || "?"; posCount[pos] = (posCount[pos] || 0) + 1; });
  const posChips = Object.entries(posCount).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="chip">${esc(k)} · ${n}</span>`).join("");
  const opts = ctry.map(r => `<option value="${esc(r.birth_country)}"${r.birth_country === S.country ? " selected" : ""}>${flagEmoji(r.birth_country)} ${esc(cname(r.birth_country))} (${r.players})</option>`).join("");
  const minPA = reg ? 50 : 5, minOuts = reg ? 30 : 3;
  view(`
    <section class="hero"><div class="meta"><h2>${flag(S.country)}${esc(cname(S.country))} · ${S.season}</h2>
      <p class="lede">${t("ctryLede").replace("{c}", esc(cname(S.country)))}</p></div>
      <div class="pick"><label for="f-country" class="note">${t("country")}</label><select id="f-country">${opts}</select></div></section>
    <div class="stats">${stat(t("ctryPlayers"), n0(sel.players), `${t("rankCountry")}: #${sel.country_rank_by_players ?? "—"}`)}${stat(t("pctPlayers"), f1(sel.pct_of_players) + "%", `${n0(sel.hitters)} ${t("hitters").toLowerCase()} · ${n0(sel.pitchers)} ${t("pitchers").toLowerCase()}`)}${stat(t("pctHR"), f1(sel.pct_of_home_runs) + "%", `${n0(sel.hr)} HR`)}${stat(t("pctSO"), f1(sel.pct_of_strikeouts) + "%", `${n0(sel.pitcher_strikeouts)} SO`)}${stat("ERA", f2(sel.era), `${n0(sel.pitcher_wins)} W · ${n0(sel.saves)} SV`)}</div>
    <div class="grid wide">
      <div class="panel"><h3>${t("byCountry")}</h3><div class="chart"><canvas id="c-ctry"></canvas></div></div>
      <div class="panel"><h3>${t("latest")}${lastDay ? ` · ${lastDay.official_date}` : ""}</h3>${table([{ h: t("player"), l: 1, cls: () => "name", v: r => pcell(r.player_id) }, { h: "TM", l: 1, v: r => `${esc(r.team_abbreviation)} ${t("vs")} ${esc(r.opponent)}` }, { h: "POS", l: 1, v: r => esc(r.position) }, { h: t("line"), l: 1, v: r => esc(r.line) }], latest, { click: r => "p:" + r.player_id, empty: t("noLatest") })}</div>
    </div>
    <section><h3>${t("stars")} · ${flag(S.country)} ${esc(cname(S.country))} · ${S.season}</h3>${stars.length ? `<div class="stars">${stars.map(st => `<div class="star" data-p="${st.r.player_id}" role="button" tabindex="0">${shot(st.r.player_id, pname(st.r.player_id))}<div class="who"><span class="cat">${st.cat}</span><span class="nm2">${esc(pname(st.r.player_id))}</span><span class="note">${logo(st.r.team_id, 18)} ${abbr(st.r.team_id)}</span></div><span class="num" style="margin-left:auto">${st.val}</span></div>`).join("")}</div>` : `<p class="empty">${t("noLine")}</p>`}</section>
    <div class="grid wide">
      <div class="panel"><h3>${t("hrBy")}</h3><div class="tall">${table([{ h: "#", v: r => hrRows.indexOf(r) + 1 }, { h: t("player"), l: 1, cls: () => "name", v: b => pcell(b.player_id) }, { h: "TM", l: 1, v: b => tcell(b.team_id) }, { h: "HR", v: b => `<b>${b.hr}</b>` }, { h: "PA", v: b => b.pa }, { h: t("abPerHr"), v: b => b.hr ? f1(b.ab / b.hr) : "—" }, { h: "AVG", v: b => f3(b.avg) }, { h: "OPS", v: b => f3(b.ops) }, { h: "RBI", v: b => b.rbi }], hrRows, { click: b => "p:" + b.player_id })}</div></div>
      <div class="panel"><h3>${t("soBy")}</h3><div class="tall">${table([{ h: "#", v: r => soRows.indexOf(r) + 1 }, { h: t("player"), l: 1, cls: () => "name", v: p => pcell(p.player_id) }, { h: "TM", l: 1, v: p => tcell(p.team_id) }, { h: "SO", v: p => `<b>${p.so}</b>` }, { h: "IP", v: p => p.ip_display }, { h: "K/9", v: p => f2(p.k_per_9) }, { h: "ERA", v: p => f2(p.era) }, { h: "W-L", v: p => `${p.w}-${p.l}` }, { h: "SV", v: p => p.sv }], soRows, { click: p => "p:" + p.player_id })}</div></div>
    </div>
    <div class="grid wide">
      <div class="panel"><h3>${t("trend")} · ${esc(cname(S.country))}</h3><div class="chart"><canvas id="c-trend"></canvas></div></div>
      <div class="panel"><h3>${t("teamsWith")} ${esc(cname(S.country))}</h3><div class="chart"><canvas id="c-teams"></canvas></div>
        <h3 style="margin-top:12px">${t("positions")}</h3><div class="chips">${posChips}</div></div>
    </div>
    <div class="panel"><h3>${t("allCountries")} · ${S.season} <span class="note">· ${t("clickHint")}</span></h3>${table([
      { h: "#", v: r => r.country_rank_by_players }, { h: t("country"), l: 1, cls: r => "name", v: r => `${flag(r.birth_country)} ` + (r.birth_country === S.country ? `<b>${esc(cname(r.birth_country))}</b>` : esc(cname(r.birth_country))) },
      { h: t("ctryPlayers"), v: r => r.players }, { h: t("pctPlayers"), v: r => f1(r.pct_of_players) }, { h: t("hitters"), v: r => r.hitters }, { h: t("pitchers"), v: r => r.pitchers },
      { h: "H", v: r => n0(r.h) }, { h: "HR", v: r => n0(r.hr) }, { h: t("pctHR"), v: r => f1(r.pct_of_home_runs) }, { h: "SO", v: r => n0(r.pitcher_strikeouts) }, { h: "W", v: r => r.pitcher_wins }, { h: "SV", v: r => r.saves }, { h: "ERA", v: r => f2(r.era) }],
      ctry, { click: r => "c:" + r.birth_country })}</div>`);
  document.getElementById("f-country").onchange = e => { S.country = e.target.value; render(); };
  const acc = css("--accent"), muted = css("--chalk");
  chart("c-ctry", { type: "bar", data: { labels: topC.map(r => cname(r.birth_country)), datasets: [{ data: topC.map(r => r.players), backgroundColor: topC.map(r => r.birth_country === S.country ? acc : muted) }] },
    options: { indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: {}, y: { ticks: { autoSkip: false } } },
      onClick: (e, els) => { if (els.length) { S.country = topC[els[0].index].birth_country; render(); } } } });
  chart("c-trend", { type: "bar", data: { labels: trendRows.map(r => r.season), datasets: [
      { type: "bar", label: t("ctryPlayers"), data: trendRows.map(r => r.players ?? 0), backgroundColor: acc, yAxisID: "y" },
      { type: "line", label: t("pctHR"), data: trendRows.map(r => r.pct_of_home_runs ?? null), borderColor: css("--gold"), backgroundColor: css("--gold"), yAxisID: "y2", pointRadius: 4 }] },
    options: { scales: { y: { beginAtZero: true, title: { display: true, text: t("ctryPlayers") } }, y2: { position: "right", beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: "%" } } } } });
  chart("c-teams", { type: "bar", data: { labels: teamsTop.map(([id]) => abbr(id)), datasets: [{ data: teamsTop.map(([, n]) => n), backgroundColor: acc }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { autoSkip: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  document.querySelectorAll("#view .star").forEach(el => { const open = () => { S.player = Number(el.dataset.p); go("player"); }; el.onclick = open; el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } }; });
  bindRows(k => { if (k.startsWith("c:")) { S.country = k.slice(2); render(); window.scrollTo({ top: 0 }); } else { S.player = Number(k.slice(2)); go("player"); } });
}

function viewQuality() {
  const q = tbl("quality");
  view(`<section><h2>${t("quality")}</h2><p class="lede">${t("qLede")}</p></section>
    <div class="panel">${table([{ h: "ID", l: 1, v: r => r.check_id }, { h: t("check"), l: 1, cls: () => "name", v: r => esc(r.check_name) }, { h: t("sev"), l: 1, v: r => `<span class="chip">${r.severity}</span>` }, { h: t("status"), v: r => `<span class="pill ${r.status === "PASS" ? "w" : r.severity === "CRITICAL" ? "l" : "g"}">${r.status}</span>` }, { h: t("failed"), v: r => n0(r.failed_rows) }, { h: t("checked"), v: r => n0(r.checked_rows) }], q)}
    <p class="note">${q.length ? q[0].checked_at : ""}</p></div>`);
}

// ---------- shell ----------
function view(html) { killCharts(); document.getElementById("view").innerHTML = html; wireImages(); }
function bindRows(fn) { document.querySelectorAll("#view tr.click").forEach(tr => tr.onclick = () => fn(tr.dataset.k)); }
function go(name) { tab = name; try { history.replaceState(null, "", "#" + name); } catch (e) {} render(); window.scrollTo({ top: 0 }); }
function render() {
  document.documentElement.lang = lang;
  document.getElementById("f-lang").textContent = lang === "es" ? "EN" : "ES";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.getElementById("mlb-logo").innerHTML = leagueLogo();
  document.getElementById("asof").textContent = `${t("asof")} ${RAW.meta.last_game_date}`;
  document.getElementById("f-season").innerHTML = seasons.map(s => `<option${s === S.season ? " selected" : ""}>${s}</option>`).join("");
  const types = ["Regular Season", "Postseason"].filter(ty => tbl("team_seasons").some(r => r.season === S.season && r.season_type === ty));
  if (!types.includes(S.type)) S.type = types[0] || "Regular Season";
  document.getElementById("f-type").innerHTML = types.map(ty => `<option value="${ty}"${ty === S.type ? " selected" : ""}>${t(ty)}</option>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(k => `<a href="#${k}" data-tab="${k}"${k === tab ? ' aria-current="page"' : ""}>${t(k)}</a>`).join("");
  document.querySelectorAll("#tabs a").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.tab); });
  document.getElementById("foot").textContent = t("foot");
  ({ league: viewLeague, team: viewTeam, player: viewPlayer, h2h: viewH2H, leaders: viewLeaders, dr: viewDR, quality: viewQuality })[tab]();
}
document.getElementById("f-season").onchange = e => { S.season = Number(e.target.value); render(); };
document.getElementById("f-type").onchange = e => { S.type = e.target.value; render(); };
document.getElementById("f-lang").onclick = () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("mlb-lang", lang); } catch (e) {} render(); };
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) { tab = h; render(); } });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
