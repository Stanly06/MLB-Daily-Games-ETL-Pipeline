# Databricks Asset Bundle — MLB Performance Intelligence Platform
#
#   databricks auth login --host https://<your-workspace>.cloud.databricks.com
#   databricks bundle deploy -t prod          # uploads src/ and creates both jobs
#   databricks bundle run mlb_setup -t prod   # once: catalog, schemas, Volumes, metadata tables
#   databricks bundle run mlb_daily -t prod --params mode=backfill   # seasons default: 2024,2025,2026
#
# The `dev` target prefixes job names with your user and pauses the schedule (safe for testing);
# `prod` keeps the daily 06:07 America/Santo_Domingo schedule active.
bundle:
  name: mlb_performance_intelligence

include:
  - resources/*.yml

variables:
  alert_email:
    description: E-mail notified when a run fails or exceeds one hour
    default: sffernandez06@gmail.com

sync:
  exclude:
    - tests/**
    - web/**
    - legacy/**
    - powerbi/**
    - assets/**
    - docs/**

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
